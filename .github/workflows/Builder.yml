name: Builder (Conda Version)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签'
        required: true
        default: 'unknown-model'
      release_name:
        description: '发布名称'
        required: false
        default: ''
      model:
        description: 'huggingface模型地址'
        required: true
        default: ''
      model_id:
        description: '模型id'
        required: true
        default: ''
      estimated_vram_bytes:
        description: '运行模型所需的vRAM'
        required: true
        default: '3000000000'

jobs:
  Builder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 释放磁盘空间
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/az_7.0.0
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force
          sudo rm -rf /var/lib/docker
          if [ -d "$ANDROID_HOME" ]; then
            echo "clean Android SDK"
            sudo rm -rf $ANDROID_HOME/ndk
            sudo rm -rf $ANDROID_HOME/ndk-bundle
            sudo rm -rf $ANDROID_HOME/emulator
            sudo rm -rf $ANDROID_HOME/system-images
            sudo rm -rf $ANDROID_HOME/platforms
          fi
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: 安装并配置 Conda 环境
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.13'
          activate-environment: mlc-env

      - name: 安装 MLC-LLM 环境(Conda/Python)
        shell: bash -el {0}
        run: |
          conda install -c conda-forge git-lfs
          python -m pip install pytest
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu

      - name: 验证 MLC-LLM 安装
        shell: bash -el {0}
        run: |
          python -c "import tvm; print(tvm.__file__)"
          
          # 将 conda 环境的 lib 目录注入动态链接路径
          export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH
          
          # 运行验证
          python -c "import mlc_llm; print(mlc_llm)"

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
          java-package: 'jdk'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Android NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/27.3.13750724" >> $GITHUB_ENV
          echo "TVM_NDK_CC=${ANDROID_HOME}/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV

      - name: 拉取 MLC-LLM 源码
        run: |
          git clone https://github.com/mlc-ai/mlc-llm.git --depth 1
          cd mlc-llm
          git submodule update --init --recursive --depth 1
          echo "MLC_LLM_SOURCE_DIR=${PWD}" >> $GITHUB_ENV
          echo "TVM_SOURCE_DIR=${PWD}/3rdparty/tvm" >> $GITHUB_ENV

      - name: 下载模型
        shell: bash -el {0}
        run: |
          pip install -U "huggingface_hub[cli]"
          echo "模型: ${{ github.event.inputs.model }}"
          hf download ${{ github.event.inputs.model }} --local-dir "model"

      - name: 环境信息
        shell: bash -el {0}
        run: |
          echo "========== 环境信息 =========="
          echo "Conda 环境: $CONDA_DEFAULT_ENV"
          echo "Python 版本: $(python --version)"
          echo "Python 路径: $(which python)"
          echo "Java 版本: $(java -version 2>&1 | head -n 1)"
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Rust 版本: $(rustc --version)"
          echo "Android NDK: $ANDROID_NDK"
          echo "TVM_NDK_CC: $TVM_NDK_CC"
          echo "=============================="

      - name: 创建编译配置
        run: |
          jq -n \
            --arg model_id "${{ github.event.inputs.model_id }}" \
            --arg vram "${{ github.event.inputs.estimated_vram_bytes }}" \
            '{
              "device": "android",
              "model_list": [
                {
                  "model": "./model",
                  "model_id": $model_id,
                  "estimated_vram_bytes": ($vram | tonumber), 
                  "bundle_weight": true
                }
              ]
            }' > mlc-package-config.json

      # 3. 核心编译步骤，必须在 Conda 环境下执行
      - name: 构建 Android SDK
        shell: bash -el {0}
        run: |
          python -m mlc_llm package
          ls -al

      - name: 打包构建文件
        run: |
          rm -rf mlc-llm
          rm -rf model
          rm -rf build
          ls -al dist/
          zip -r sdk.zip dist/
      
      - name: 上传构建文件
        uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: dist/
          retention-days: 30

      - name: 发布构建文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            sdk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
